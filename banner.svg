<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"><animate attributeName="stop-color" values="#0F172A;#1E1B4B;#0F172A" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="55%" stop-color="#1E3A8A"><animate attributeName="stop-color" values="#1E3A8A;#312E81;#1E3A8A" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#6366F1"><animate attributeName="stop-color" values="#6366F1;#2563EB;#6366F1" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 58px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #FFFFFF; opacity: 0; animation: rise 1.2s ease-out 0.2s forwards; }
    .tag  { font: 500 19px 'JetBrains Mono', Consolas, monospace; fill: #BFDBFE; opacity: 0; animation: rise 1.2s ease-out 0.9s forwards; }
    .line { fill: none; stroke: url(#wave); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.6s ease-out 0.4s forwards; }
    .line2 { opacity: .45; stroke-width: 2; animation-delay: 0.8s; }
    .dot { fill: #93C5FD; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity: .25; r: 3; } 50% { opacity: 1; r: 6; } }
  </style>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <path class="line" d="M0 205 C 150 165, 250 245, 400 205 S 650 165, 800 205 S 960 235, 1000 210"/>
  <path class="line line2" d="M0 225 C 170 190, 290 255, 450 222 S 700 190, 860 228 S 960 250, 1000 232"/>
  <text x="60" y="118" class="name">Dharaksh Kataria</text>
  <text x="62" y="158" class="tag">CSE @ SRM IST · EdTech &amp; AI Product Builder</text>
  <circle class="dot" cx="940" cy="60" r="4"/>
  <circle class="dot" cx="905" cy="90" r="3" style="animation-delay:.6s"/>
  <circle class="dot" cx="960" cy="110" r="3" style="animation-delay:1.2s"/>
</svg>
