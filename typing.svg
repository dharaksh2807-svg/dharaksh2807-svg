<svg xmlns="http://www.w3.org/2000/svg" width="820" height="50" viewBox="0 0 820 50" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { font: 600 19px 'JetBrains Mono', Consolas, monospace; fill: #6366F1; opacity: 0; animation: cycle 12s linear infinite; }
    .t2 { animation-delay: 4s; }
    .t3 { animation-delay: 8s; }
    .cur { fill: #6366F1; animation: blink 1s steps(1) infinite; }
    @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 28% { opacity: 1; } 33%,100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <text x="410" y="32" text-anchor="middle" class="t">Building student-centric EdTech &amp; AI tools</text>
  <text x="410" y="32" text-anchor="middle" class="t t2">Creator of SRM Smart Study Hub: 67 subjects, 6 semesters</text>
  <text x="410" y="32" text-anchor="middle" class="t t3">Full-stack: Next.js 15, TypeScript, Prisma, PostgreSQL</text>
</svg>
